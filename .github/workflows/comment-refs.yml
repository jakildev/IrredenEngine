name: Comment Refs

# Issue and PR numbers do not belong in code comments (.claude/rules/comments.md).
# scripts/lint_comment_refs.py is a per-file ratchet against
# scripts/lint_comment_refs_baseline.json: a file may lose references, never
# gain them. Unfiltered on purpose — the population is every code file class
# in the tree, so any push can regress it.
#
# Every run is measured against the tree it was built on — a pull request
# against its merge commit's first parent, a push against the previous tip —
# with that tree's baseline, so a baseline edit in the same change cannot buy
# budget, and fails only on an offender it introduced; earlier offenders print
# as inherited. A red master would otherwise turn every later run red and
# hide the one that adds a regression. The flat tree reading is
# `workflow_dispatch`, or the script run with no flag.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comment-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A push of several commits reaches back further than fetch-depth 2, so
      # the previous tip is fetched by sha. A branch's first push has no
      # previous tip (the zero sha) and is measured flat.
      - name: Resolve the tree to measure against
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          against=""
          if [ "$EVENT" = pull_request ]; then
            against="HEAD^1"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            if git fetch --no-tags --depth=1 origin "$BEFORE"; then
              against="$BEFORE"
            else
              echo "previous tip $BEFORE is unreachable; measuring the tree flat"
            fi
          fi
          if [ -n "$against" ]; then
            if git show "$against:scripts/lint_comment_refs_baseline.json" > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
              echo "RATCHET_ARGS=--baseline $RUNNER_TEMP/base-baseline.json --against $against" >> "$GITHUB_ENV"
            else
              echo "RATCHET_ARGS=--against $against" >> "$GITHUB_ENV"
              echo "$against has no baseline yet; checking against the committed one"
            fi
          fi

      - name: Comment reference ratchet
        run: python3 scripts/lint_comment_refs.py $RATCHET_ARGS
