name: Comment Refs

# Issue and PR numbers do not belong in code comments (.claude/rules/comments.md).
# scripts/lint_comment_refs.py is a per-file ratchet against
# scripts/lint_comment_refs_baseline.json: a file may lose references, never
# gain them. Unfiltered on purpose — the population is every code file class
# in the tree, so any push can regress it.
#
# A pull request is also measured against the tree its merge commit was built
# on (the first parent, hence fetch-depth 2), and fails only on an offender it
# introduced; the base's own offenders print as inherited. A red master would
# otherwise turn every PR red and hide the one that adds a regression. A push
# to master is measured flat, so a red master stays red.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comment-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A pull request is measured against the base branch's baseline, so a
      # baseline edit in the same PR cannot buy budget. The merge commit's
      # first parent is the base branch as the merge was built.
      - name: Read the base branch's baseline
        if: github.event_name == 'pull_request'
        run: |
          if git show "HEAD^1:scripts/lint_comment_refs_baseline.json" > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null; then
            echo "RATCHET_ARGS=--baseline $RUNNER_TEMP/base-baseline.json --against HEAD^1" >> "$GITHUB_ENV"
          else
            echo "base branch has no baseline yet; checking against the committed one"
          fi

      - name: Comment reference ratchet
        run: python3 scripts/lint_comment_refs.py $RATCHET_ARGS
