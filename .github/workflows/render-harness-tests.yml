name: Render Harness Tests

# The render-verify harness's own unittest suites (scripts/tests/). They are
# not CMake tests, so `ctest` never sees them — without this workflow nothing
# executes them and a suite can go red silently (#2825).
#
# Standalone for the same reason fleet-tests.yml is: the only other CI surface
# that would reach these was the umbrella quality.yml's ruff/ctest job, and that
# workflow is retired (#2718) — it was disabled at the repo level for months
# first, so a step added there was inert either way. Shader contract suites
# require a C++ compiler but no graphics context or CMake build.
#
# Path-filtered to the **subjects** (scripts/*.py — where every dashed harness
# script and the shared modules they import live) as well as the
# suites themselves, not just the suites' own directory. Filtering on the
# suites' location alone is the shape #2810 records against fleet-tests.yml:
# a PR that breaks a subject then skips the only coverage guarding it.
# `scripts/*` does not match across `/`, so scripts/fleet/** is excluded —
# that tree has its own workflow. scripts/perf/compare_perf_runs.py is named
# individually: test_occlusion_fire_verify.py feeds synthetic reports through
# its `parse_report`, so a change to that parser is a change to a subject here. The two path lists are duplicated because
# GitHub Actions does not support YAML anchors — keep them in sync;
# scripts/fleet/tests/test_workflow_paths_sync.sh (#2929) ratchets that they do,
# for this workflow as for every other path-filtered one.
#
# The demo manifests are a subject too (#2919): test_render_verify.py's
# CommittedManifestsResolve asserts every committed
# creations/demos/*/test/references/manifest.json declares a `target` and
# round-trips back to its own directory, so `--all` can't silently shed a demo.
# Adding or editing a manifest is exactly the change that breaks that guard,
# and without the path below it is the change that skips it.

on:
  push:
    branches: [master]
    paths:
      - 'scripts/*.py'
      - 'scripts/perf/compare_perf_runs.py'
      - 'scripts/tests/**'
      - 'engine/render/src/shaders/**'
      - 'engine/prefabs/irreden/render/systems/system_shapes_to_trixel.hpp'
      - 'creations/demos/*/test/references/manifest.json'
      - '.github/workflows/render-harness-tests.yml'
  pull_request:
    paths:
      - 'scripts/*.py'
      - 'scripts/perf/compare_perf_runs.py'
      - 'scripts/tests/**'
      - 'engine/render/src/shaders/**'
      - 'engine/prefabs/irreden/render/systems/system_shapes_to_trixel.hpp'
      - 'creations/demos/*/test/references/manifest.json'
      - '.github/workflows/render-harness-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-harness-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The suites are hermetic — synthetic PNGs and scalar shader helpers,
      # no engine binary or GL context. They use the runner C++ compiler and
      # pinned Pillow. The gating path (render-verify, the
      # comparator and the metrics its manifests name) is stdlib-only; Pillow
      # is for the hand-run metrics and the suite over the shadow-box one, per
      # the "Harness dependency contract" in docs/agents/VALIDATION.md. The pin
      # is the version those suites are measured green on: a filter or fill
      # change in a new Pillow would move an oracle with no diff in this repo.
      # setup-python, not the runner's system interpreter: Ubuntu marks that
      # one externally managed (PEP 668), and run_all.sh calls `python3`.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove scalar shader compiler is available
        run: c++ --version

      - name: Install Pillow
        run: python3 -m pip install pillow==12.2.0

      # A failing install reads as the gate not running; this makes it name
      # itself, and proves `python3` is the interpreter that got the package.
      - name: Prove Pillow imports
        run: python3 -c "import PIL; print(PIL.__version__)"

      # No separate "prove the gate still fires" step: run_all.sh's own
      # negative controls ship as test_run_all.py and run as one of the
      # suites below. It asserts the runner reports a failing suite, exits
      # non-zero on an empty directory (so a glob that matches nothing cannot
      # read as green), and — the #2825 lock — that a suite depending on a
      # sibling's sys.path insert FAILS under the runner while passing under a
      # shared-interpreter discover.
      #
      # The log is captured so the next step can prove the Pillow-dependent
      # suite ran rather than skipped. `shell: bash` is load-bearing: a bare
      # `run:` gets `bash -e {0}`, and only a named `shell: bash` adds
      # `-o pipefail` — without it the step's status is tee's, always 0.
      # test_run_all.py's WorkflowKeepsRunnerStatusTest pins this.
      - name: Run render harness tests
        shell: bash
        run: bash scripts/tests/run_all.sh | tee run_all.log

      # run_all.sh reports `PASS  <suite> (<N> tests)`, with a `skipped`
      # suffix when any skipped. A suite that exited 0 without running its
      # tests reads as green everywhere else, so pin this one: it needs
      # Pillow, and is the suite whose missing dependency turned this job red.
      - name: Assert the Pillow-dependent suite executed
        run: grep -a -E '^PASS  test_render_shadow_box_edges\.py \([1-9][0-9]* tests\)$' run_all.log

      - name: Assert the SDF shader contract executed
        run: grep -a -E '^PASS  test_render_sdf_surface_contract\.py \([1-9][0-9]* tests\)$' run_all.log

      - name: Assert the SDF winner contract executed
        run: grep -a -E '^PASS  test_render_sdf_winner\.py \([1-9][0-9]* tests\)$' run_all.log
