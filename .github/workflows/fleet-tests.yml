name: Fleet Tests

# The fleet's own bash/python suites (scripts/fleet/tests/). They are not
# CMake tests, so `ctest` never sees them — without this workflow nothing
# executes them and a suite can go red silently (#2712).
#
# Standalone rather than a step in quality.yml: that workflow is disabled
# at the repo level, so any step added there is inert (re-enabling it is a
# separate call — see #2718). These suites need no compiler, no GL, and no
# CMake, so they have no reason to ride along with a build job anyway.
#
# Path-filtered to the fleet tooling surface — engine, shader, and asset
# PRs skip this entirely (same convention as perf-gate.yml).
#
# The first filter is scripts/** and not scripts/fleet/**: the suites live
# under scripts/fleet/tests/, but test_lint_python_registry.py derives its
# population from ALL of scripts/ (lint_python_registry.py's _SCAN_ROOT), so
# an extension-less Python executable landing anywhere under scripts/ — the
# top level, scripts/dev/, scripts/perf/ — changes that suite's subject
# without touching scripts/fleet/**. test_fleet_tests_workflow_paths.sh T4
# ratchets this filter against that constant. This deliberately overlaps
# render-harness-tests.yml's scripts/*.py — the two workflows run disjoint
# suites, and narrowing either back to buy the non-overlap reopens #2859.
#
# Five suites reach outside scripts/ entirely for their subject under test —
# their subjects are listed explicitly below so a PR touching only one of
# them still runs this workflow (#2786, #2810, #2823, #2859):
#   test_format_changed_line_scoping.sh -> cmake/run_clang_format_changed.cmake
#   test_ir_build_dir_resolution.sh     -> engine/tools/lib/concurrency_helpers.sh
#   test_fleet_transition.sh            -> docs/agents/fleet-state-machine.json
#   test_lint_rules_commands.py         -> .claude/rules/**, docs/agents/**
#   test_lint_python_registry.py        -> ruff.toml
# test_lint_rules_commands.py's subjects are globs rather than single files —
# it checks every rules/protocol doc's fenced Detection/command blocks, so a
# PR that edits only a rules or protocol doc must still trigger this
# workflow; without those paths the exact PR that landed a
# doc-ahead-of-executor citation (ce2d2c57a) would not have run it (#2823).
# `docs/agents/**` subsumes docs/agents/fleet-state-machine.json — the
# narrower entry stays because the ratchet below asserts that subject by name.
# The two `paths:` blocks are duplicated because GitHub Actions has no YAML
# anchors — keep them in sync (same note as header-checks.yml);
# scripts/fleet/tests/test_fleet_tests_workflow_paths.sh ratchets that they do.

on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.claude/rules/**'
      - 'docs/agents/**'
      - '.github/workflows/fleet-tests.yml'
      - 'cmake/run_clang_format_changed.cmake'
      - 'engine/tools/lib/concurrency_helpers.sh'
      - 'docs/agents/fleet-state-machine.json'
      - 'ruff.toml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.claude/rules/**'
      - 'docs/agents/**'
      - '.github/workflows/fleet-tests.yml'
      - 'cmake/run_clang_format_changed.cmake'
      - 'engine/tools/lib/concurrency_helpers.sh'
      - 'docs/agents/fleet-state-machine.json'
      - 'ruff.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fleet-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The suites are hermetic by the authoring rules (no live GitHub, no
      # live ~/.fleet), and resolve the tool under test from their own
      # directory — so a plain checkout is the whole environment. bash, python3
      # and gh are preinstalled on ubuntu-latest.
      - name: Run fleet tool tests
        run: bash scripts/fleet/tests/run_all.sh
