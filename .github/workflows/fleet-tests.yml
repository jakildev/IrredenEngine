name: Fleet Tests

# The fleet's own bash/python suites (scripts/fleet/tests/). They are not
# CMake tests, so `ctest` never sees them — without this workflow nothing
# executes them and a suite can go red silently (#2712).
#
# Standalone rather than a step in the umbrella quality.yml: that workflow is
# retired, its gates rehomed one per workflow (#2718) — and while it still
# existed it was disabled at the repo level, so any step added there was inert.
# These suites need no compiler, no GL, and no CMake, so they have no reason to
# ride along with a build job anyway.
#
# Path-filtered, but NOT to the fleet tooling surface alone: the filter is the
# union of where the suites LIVE and what they TEST, and several test files
# under cmake/, engine/ and creations/ (see the sweep below), so engine PRs
# touching one of those do run this. The suites need no compiler and no GL, so
# the extra runs are cheap; an unfiltered subject is not.
#
# The first filter is scripts/** and not scripts/fleet/**: the suites live
# under scripts/fleet/tests/, but test_lint_python_registry.py derives its
# population from ALL of scripts/ (lint_python_registry.py's _SCAN_ROOT), so
# an extension-less Python executable landing anywhere under scripts/ — the
# top level, scripts/dev/, scripts/perf/ — changes that suite's subject
# without touching scripts/fleet/**. test_fleet_tests_workflow_paths.sh T4
# ratchets this filter against that constant. This deliberately overlaps
# render-harness-tests.yml's scripts/*.py — the two workflows run disjoint
# suites, and narrowing either back to buy the non-overlap reopens #2859.
#
# Many suites reach outside scripts/ entirely for their subject under test —
# their subjects are listed explicitly below so a PR touching only one of
# them still runs this workflow (#2786, #2810, #2823, #2859, #2929, #3187).
# The list is no longer hand-curated: scripts/fleet/fleet_test_subjects.py
# derives it (every tracked path a suite source names, plus the derived
# both-blocks workflow set) and fails when this filter or
# OUT_OF_TREE_SUBJECTS misses a member. The long tail below is that sweep;
# the suites whose subject is named here are:
#   test_format_changed_line_scoping.sh -> cmake/run_clang_format_changed.cmake
#   test_format_changed_standalone.sh   -> cmake/run_clang_format_changed_standalone.cmake
#   test_ir_build_dir_resolution.sh     -> engine/tools/lib/concurrency_helpers.sh
#   test_fleet_transition.sh            -> docs/agents/fleet-state-machine.json
#   test_fleet_labels_check.sh          -> docs/agents/fleet-state-machine.json,
#                                          docs/agents/fleet-labels-reference.md
#   test_lint_rules_commands.py         -> .claude/rules/**, docs/agents/**
#   test_lint_comment_refs.py           -> .claude/skills/simplify/**
#   test_fleet_pr_body_lint.py          -> the commit-and-push PR-body and
#                                          edit-or-create procedures
#   test_workflow_paths_sync.sh         -> the other path-filtered workflows
#                                          (engine-tests, format-check, header-checks,
#                                          perf-gate, python-lint,
#                                          render-harness-tests)
#   test_lint_python_registry.py        -> ruff.toml
# test_lint_rules_commands.py's subjects are globs rather than single files
# — it checks every rules/protocol doc's fenced Detection/command blocks, so
# a PR that edits only a rules or protocol doc must still trigger this
# workflow; without those paths the exact PR that landed a
# doc-ahead-of-executor citation (ce2d2c57a) would not have run it (#2823).
# `docs/agents/**` subsumes docs/agents/fleet-state-machine.json — the
# narrower entry stays because the ratchet below asserts that subject by
# name. test_workflow_paths_sync.sh is the only entry whose subject set is
# *derived* (a .github/workflows/*.yml glob) rather than a fixed file, so it
# can grow without anyone editing this list. Two checks cover that growth:
# T4 in test_workflow_paths_sync.sh asserts every derived workflow appears in
# the two blocks below, and fleet_test_subjects.py asserts the same population
# is registered in OUT_OF_TREE_SUBJECTS; T4 alone covers only the first.
# python-lint.yml (#2718) and format-check.yml (#3187) are instances: each
# declares both blocks, so each is that suite's subject and must appear below.
# The two `paths:` blocks are duplicated because GitHub Actions has no YAML
# anchors — keep them in sync (same note as header-checks.yml);
# scripts/fleet/tests/test_fleet_tests_workflow_paths.sh ratchets that they do.

on:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - '.claude/rules/**'
      - '.claude/skills/simplify/**'
      - '.claude/skills/commit-and-push/procedures/pr-body.md'
      - '.claude/skills/commit-and-push/procedures/stackable-on.md'
      - 'docs/agents/**'
      - '.github/workflows/engine-tests.yml'
      - '.github/workflows/fleet-tests.yml'
      - '.github/workflows/format-check.yml'
      - '.github/workflows/header-checks.yml'
      - '.github/workflows/perf-gate.yml'
      - '.github/workflows/python-lint.yml'
      - '.github/workflows/render-harness-tests.yml'
      - 'cmake/run_clang_format_changed.cmake'
      - 'cmake/run_clang_format_changed_standalone.cmake'
      - 'engine/tools/lib/concurrency_helpers.sh'
      - 'docs/agents/fleet-state-machine.json'
      - 'docs/agents/fleet-labels-reference.md'
      - 'ruff.toml'
      - '.clang-format'
      - '.claude/commands/role-opus-architect.md'
      - '.claude/commands/role-opus-reviewer.md'
      - '.claude/commands/role-worker.md'
      - '.claude/settings.json'
      - '.claude/skills/commit-and-push/SKILL.md'
      - '.claude/skills/commit-and-push/procedures/stackable-on.md'
      - '.claude/skills/simplify/SKILL.md'
      - '.fleet/plans/issue-1394.md'
      - '.fleet/plans/issue-1596.md'
      - '.fleet/plans/issue-1824.md'
      - '.fleet/plans/issue-2197.md'
      - '.fleet/plans/issue-667.md'
      - '.github/workflows/auto-rereview.yml'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'README.md'
      - 'cmake/ir_quality_tools.cmake'
      - 'cmake/run_header_checks_standalone.cmake'
      - 'cmake/run_header_convention_checks.cmake'
      - 'cmake/run_metal_kernel_registry_check.cmake'
      - 'cmake/run_metal_scratch_consumer_check.cmake'
      - 'cmake/run_save_inventory_population_check.cmake'
      - 'creations/CLAUDE.md'
      - 'creations/editors/voxel_editor/main.cpp'
      - 'docs/design/claude-md-sharing.md'
      - 'docs/design/detached-revoxelize-world-light.md'
      - 'docs/design/skill-sharing.md'
      - 'docs/design/voxel-occlusion-culling.md'
      - 'engine/render/include/irreden/render/gl_wrap/GL.h'
      - 'engine/render/include/irreden/render/metal/metal_runtime.hpp'
      - 'engine/render/src/metal/metal_cocoa_bridge.mm'
      - 'engine/render/src/metal/metal_pipeline.cpp'
      - 'engine/render/src/opengl/opengl_shader.cpp'
      - 'engine/tools/bin/ir-build'
      - 'engine/tools/bin/ir-run'
      - 'engine/video/src/metal/video_backend.cpp'
      - 'engine/video/src/opengl/video_backend.cpp'
      - 'engine/world/include/irreden/world/save_component_inventory.hpp'
  pull_request:
    paths:
      - 'scripts/**'
      - '.claude/rules/**'
      - '.claude/skills/simplify/**'
      - '.claude/skills/commit-and-push/procedures/pr-body.md'
      - '.claude/skills/commit-and-push/procedures/stackable-on.md'
      - 'docs/agents/**'
      - '.github/workflows/engine-tests.yml'
      - '.github/workflows/fleet-tests.yml'
      - '.github/workflows/format-check.yml'
      - '.github/workflows/header-checks.yml'
      - '.github/workflows/perf-gate.yml'
      - '.github/workflows/python-lint.yml'
      - '.github/workflows/render-harness-tests.yml'
      - 'cmake/run_clang_format_changed.cmake'
      - 'cmake/run_clang_format_changed_standalone.cmake'
      - 'engine/tools/lib/concurrency_helpers.sh'
      - 'docs/agents/fleet-state-machine.json'
      - 'docs/agents/fleet-labels-reference.md'
      - 'ruff.toml'
      - '.clang-format'
      - '.claude/commands/role-opus-architect.md'
      - '.claude/commands/role-opus-reviewer.md'
      - '.claude/commands/role-worker.md'
      - '.claude/settings.json'
      - '.claude/skills/commit-and-push/SKILL.md'
      - '.claude/skills/commit-and-push/procedures/stackable-on.md'
      - '.claude/skills/simplify/SKILL.md'
      - '.fleet/plans/issue-1394.md'
      - '.fleet/plans/issue-1596.md'
      - '.fleet/plans/issue-1824.md'
      - '.fleet/plans/issue-2197.md'
      - '.fleet/plans/issue-667.md'
      - '.github/workflows/auto-rereview.yml'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'README.md'
      - 'cmake/ir_quality_tools.cmake'
      - 'cmake/run_header_checks_standalone.cmake'
      - 'cmake/run_header_convention_checks.cmake'
      - 'cmake/run_metal_kernel_registry_check.cmake'
      - 'cmake/run_metal_scratch_consumer_check.cmake'
      - 'cmake/run_save_inventory_population_check.cmake'
      - 'creations/CLAUDE.md'
      - 'creations/editors/voxel_editor/main.cpp'
      - 'docs/design/claude-md-sharing.md'
      - 'docs/design/detached-revoxelize-world-light.md'
      - 'docs/design/skill-sharing.md'
      - 'docs/design/voxel-occlusion-culling.md'
      - 'engine/render/include/irreden/render/gl_wrap/GL.h'
      - 'engine/render/include/irreden/render/metal/metal_runtime.hpp'
      - 'engine/render/src/metal/metal_cocoa_bridge.mm'
      - 'engine/render/src/metal/metal_pipeline.cpp'
      - 'engine/render/src/opengl/opengl_shader.cpp'
      - 'engine/tools/bin/ir-build'
      - 'engine/tools/bin/ir-run'
      - 'engine/video/src/metal/video_backend.cpp'
      - 'engine/video/src/opengl/video_backend.cpp'
      - 'engine/world/include/irreden/world/save_component_inventory.hpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fleet-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The suites are hermetic by the authoring rules (no live GitHub, no
      # live ~/.fleet), and resolve the tool under test from their own
      # directory — so a plain checkout is the whole environment. bash, python3
      # and gh are preinstalled on ubuntu-latest.
      - name: Run fleet tool tests
        run: bash scripts/fleet/tests/run_all.sh
