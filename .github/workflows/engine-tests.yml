name: Engine Tests

on:
  push:
    branches: [master]
    paths:
      - 'engine/**'
      - 'creations/**'
      - 'test/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakePresets.json'
      - 'assets/demos/sprite_demo/**'
      - 'scripts/render-sprite-orientation-metric.py'
      - '.github/workflows/engine-tests.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'creations/**'
      - 'test/**'
      - 'tools/**'
      - 'cmake/**'
      - 'CMakePresets.json'
      - 'assets/demos/sprite_demo/**'
      - 'scripts/render-sprite-orientation-metric.py'
      - '.github/workflows/engine-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 cmake ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev xorg-dev xvfb xauth \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libavdevice-dev libavfilter-dev

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build tests
        run: cmake --build --preset linux-tests --parallel 2

      - name: Run tests
        run: ctest --preset linux-default-tests

      - name: Exercise native OpenGL sun-index readback
        run: |
          xvfb-run --auto-servernum build/IrredenEngineTest \
            --gtest_filter=SunProbeGpuTest.SourceFaceProbeReadsPendingGpuClearAndTileBoundaries \
            --gtest_output=json:build/sun-probe-gpu.json
          python3 - <<'PYTEST'
          import json
          with open("build/sun-probe-gpu.json") as report:
              result = json.load(report)
          if result["tests"] != 1 or result.get("disabled", 0) or result.get("failures", 0):
              raise SystemExit("Expected one passing GPU probe test")
          cases = [case for suite in result["testsuites"] for case in suite["testsuite"]]
          if len(cases) != 1 or cases[0].get("result") != "COMPLETED":
              raise SystemExit("GPU probe was skipped instead of executed")
          PYTEST

      - name: Build smoke target (IRShapeDebug)
        run: cmake --build build --target IRShapeDebug -j $(nproc)

      # Draws the two-tone fixture sprite on OpenGL and grades which way up it
      # is. The screenshot directory is empty on a fresh checkout, so every
      # full-frame capture in it is one of this run's shots.
      - name: Sprite frame orientation on OpenGL
        run: |
          cmake --build build --target IRSpriteDemo -j $(nproc)
          demo_dir=build/creations/demos/sprite_demo
          (cd "$demo_dir" && xvfb-run --auto-servernum -- \
            timeout 300 ./IRSpriteDemo --auto-screenshot 10)
          shopt -s nullglob
          captures=("$demo_dir"/save_files/screenshots/screenshot_[0-9][0-9][0-9][0-9][0-9][0-9].png)
          if [[ ${#captures[@]} -lt 2 ]]; then
            echo "expected the demo's two shots, found ${#captures[@]} capture(s)" >&2
            exit 1
          fi
          python3 scripts/render-sprite-orientation-metric.py "${captures[@]}"
