name: PR Closes Lint

# Fails when merging the PR would close an issue its body does not declare on
# a link line. GitHub closes issues from the PR title, every commit message
# the merge carries (markdown code spans included) and the body, so this runs
# on every push and every title/body edit, not once at open.
#
# No `paths:` filter: any PR's commit messages can carry a closing keyword.
# Not a required status check; a red run is a needs-fix through
# REVIEWER-PROTOCOL.md "Nits vs needs-fix". The PR title and body are fetched
# by the tool over REST, never interpolated into a script here.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  closes-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint would-close refs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 scripts/fleet/fleet-pr-closes-lint --pr "$PR_NUMBER" --repo "$REPO"
