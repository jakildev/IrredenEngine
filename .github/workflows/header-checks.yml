name: Header Checks

# Every text-only convention check the repo runs without a compiler. They live
# in cmake/run_*check*.cmake and reach CI through run_header_checks_standalone.cmake,
# which include()s each of them.
#
# Adding one means adding its include() to that shim and a firing arm to
# scripts/fleet/tests/test_header_checks_standalone.sh. The `paths:` filters
# below are NOT a third leg any more: they match the checker glob, so a new
# checker triggers this job by existing (#3118). Both halves of that are
# executed — the suite's census section fails when a checker in cmake/ has no
# shim include, and fails again if either `paths:` block below stops matching a
# checker filename that does not exist yet. A convention statement drifting
# from its executor is the #2727 failure this whole lineage is about, so the
# structure enforces it rather than this comment.
#
# Standalone for the same reason fleet-tests.yml is: the only other caller of
# these checks is the `lint` CMake target, and `lint` has no CI path — its only
# route was the umbrella quality.yml, which never ran green and is retired
# (#2718). This workflow is therefore the sole CI path for these checks. See
# #2794.
#
# Runs the checks through cmake/run_header_checks_standalone.cmake, which globs
# the source tree directly — no configure, no FetchContent, no compiler, so this
# stays a fast job on a bare runner with cmake.
#
# Path-filtered to the C/C++ surface the checks scan plus the cmake files that
# implement them (same convention as perf-gate.yml and fleet-tests.yml). The two
# path lists are duplicated because GitHub Actions does not support YAML
# anchors — keep them in sync.

on:
  push:
    branches: [master]
    paths:
      - 'engine/**'
      - 'creations/**'
      - 'test/**'
      - 'tools/**'
      - 'cmake/ir_quality_tools.cmake'
      - 'cmake/run_*check*.cmake'
      - 'scripts/fleet/tests/test_header_checks_standalone.sh'
      - '.github/workflows/header-checks.yml'
  pull_request:
    paths:
      - 'engine/**'
      - 'creations/**'
      - 'test/**'
      - 'tools/**'
      - 'cmake/ir_quality_tools.cmake'
      - 'cmake/run_*check*.cmake'
      - 'scripts/fleet/tests/test_header_checks_standalone.sh'
      - '.github/workflows/header-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A green check run looks identical whether it scanned everything or
      # nothing, so prove the detector still fires before trusting it.
      - name: Positive-control the checker
        run: bash scripts/fleet/tests/test_header_checks_standalone.sh

      # cmake is preinstalled on ubuntu-latest. Nothing else is needed: the
      # checks only glob and read text.
      - name: Run header convention checks
        run: cmake -DPROJECT_ROOT="$GITHUB_WORKSPACE" -P cmake/run_header_checks_standalone.cmake
